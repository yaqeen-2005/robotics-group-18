<div id="warehouse-nav-demo" style="display:grid;gap:calc(var(--font-size-base)*0.75)">
  <div>
    <h1>A to B warehouse task</h1>
    <p class="text-muted">The person blocks the upper crossing; the robot waits, reroutes, and uses the lower aisle.</p>
  </div>
  <div class="viz-controls" aria-label="Animation controls">
    <button class="btn btn-primary" id="warehouse-play" type="button">Play</button>
    <button class="btn" id="warehouse-prev" type="button">Previous</button>
    <button class="btn" id="warehouse-next" type="button">Next</button>
    <button class="btn btn-ghost" id="warehouse-reset" type="button">Reset</button>
  </div>
  <div class="viz-row" id="warehouse-status" aria-live="polite"></div>
  <svg id="warehouse-grid" viewBox="0 0 920 610" role="img" aria-label="Warehouse map with black walls and racks, a blue robot travelling from A to B, a red moving person and the planned route" style="width:100%;height:auto"></svg>
  <div class="viz-row text-small text-muted" aria-label="Legend">
    <span>A: pickup</span><span>B: delivery</span><span>Blue: robot</span><span>Red: person</span><span>Black: wall or rack</span><span>Line: A-star route</span>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('warehouse-nav-demo');
  const svg = root.querySelector('#warehouse-grid');
  const status = root.querySelector('#warehouse-status');
  const play = root.querySelector('#warehouse-play');
  const robots = [[2,7],[2,7],[2,7],[2,7],[2,7],[2,8],[2,9],[2,10],[2,11],[2,12],[3,12],[4,12],[5,12],[6,12],[7,12],[8,12],[9,12],[10,12],[11,12],[12,12],[13,12],[14,12],[15,12],[16,12],[17,12],[18,12],[19,12],[20,12],[21,12],[21,11],[21,10],[21,9],[21,8]];
  const humans = [[17,5],[16,5],[15,5],[14,5],[13,5],[12,5],[12,5],[12,5],[12,5],[12,5],[12,5],[12,5],[12,5],[12,5],[13,5],[14,5],[15,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5],[16,5]];
  const actions = ['MOVE','WAIT','WAIT','WAIT','WAIT','REROUTE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE','MOVE'];
  const scores = [null,0.28,0.36,0.44,0.52,0.60,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null];
  const oldRoute = [[2,8],[2,7],[2,6],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5],[12,5],[13,5],[14,5],[15,5],[16,5],[17,5],[18,5],[19,5],[20,5],[21,5],[21,6],[21,7],[21,8]];
  const newRoute = [[2,7],[2,8],[2,9],[2,10],[2,11],[2,12],[3,12],[4,12],[5,12],[6,12],[7,12],[8,12],[9,12],[10,12],[11,12],[12,12],[13,12],[14,12],[15,12],[16,12],[17,12],[18,12],[19,12],[20,12],[21,12],[21,11],[21,10],[21,9],[21,8]];
  const width = 24, height = 16, cell = 34, offsetX = 52, offsetY = 34;
  const ns = 'http://www.w3.org/2000/svg';
  let frame = 0, timer = null;

  function node(name, attrs, text) {
    const element = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
    if (text !== undefined) element.textContent = text;
    return element;
  }
  function center(point) {
    return [offsetX + point[0] * cell + cell / 2, offsetY + point[1] * cell + cell / 2];
  }
  function isRack(x, y) {
    const shelfRow = (y >= 2 && y <= 3) || (y >= 6 && y <= 7) || (y >= 10 && y <= 11);
    return shelfRow && ((x >= 4 && x <= 9) || (x >= 15 && x <= 20));
  }
  function isWall(x, y) {
    return x === 0 || x === width - 1 || y === 0 || y === height - 1 || (x === 12 && y !== 5 && y !== 12);
  }
  function route(points, color, dash, opacity) {
    const value = points.map(point => center(point).join(',')).join(' ');
    svg.append(node('polyline', {points:value,fill:'none',stroke:color,'stroke-width':'7','stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':dash || '',opacity:opacity || '1'}));
  }
  function station(point, label, color) {
    const [x, y] = center(point);
    svg.append(node('circle', {cx:x,cy:y,r:'16',fill:color,stroke:'var(--background)','stroke-width':'3'}));
    svg.append(node('text', {x,y:y+5,'text-anchor':'middle',fill:'var(--primary-foreground)','font-weight':'500'}, label));
  }
  function drawHuman(point) {
    const [x, y] = center(point);
    const group = node('g', {'aria-label':'Moving person'});
    group.append(node('circle', {cx:x,cy:y-8,r:'7',fill:'var(--red)'}));
    group.append(node('line', {x1:x,y1:y-1,x2:x,y2:y+12,stroke:'var(--red)','stroke-width':'6','stroke-linecap':'round'}));
    group.append(node('line', {x1:x,y1:y+5,x2:x-9,y2:y+14,stroke:'var(--red)','stroke-width':'4','stroke-linecap':'round'}));
    group.append(node('line', {x1:x,y1:y+5,x2:x+9,y2:y+14,stroke:'var(--red)','stroke-width':'4','stroke-linecap':'round'}));
    svg.append(group);
    svg.append(node('text', {x,y:y-20,'text-anchor':'middle',fill:'var(--foreground)','font-weight':'500'}, 'PERSON'));
  }
  function headingAngle(index) {
    const current = robots[index];
    const previous = index > 0 ? robots[index - 1] : [2,8];
    let dx = current[0] - previous[0], dy = current[1] - previous[1];
    if (dx === 0 && dy === 0 && index > 0) return headingAngle(index - 1);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }
  function drawRobot(point, index) {
    const [x, y] = center(point);
    const group = node('g', {transform:`rotate(${headingAngle(index)} ${x} ${y})`,'aria-label':'Autonomous pallet robot'});
    group.append(node('rect', {x:x-16,y:y-13,width:'32',height:'26',rx:'5',fill:'var(--blue)',stroke:'var(--background)','stroke-width':'3'}));
    group.append(node('polygon', {points:`${x+19},${y} ${x+9},${y-7} ${x+9},${y+7}`,fill:'var(--yellow)'}));
    group.append(node('text', {x:x-3,y:y+5,'text-anchor':'middle',fill:'var(--primary-foreground)','font-weight':'500'}, 'R'));
    svg.append(group);
    svg.append(node('text', {x,y:y-22,'text-anchor':'middle',fill:'var(--foreground)','font-weight':'500'}, 'ROBOT'));
  }
  function draw() {
    svg.replaceChildren();
    svg.append(node('rect', {x:offsetX,y:offsetY,width:width*cell,height:height*cell,fill:'var(--card)'}));
    for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
      const blocked = isWall(x,y) || isRack(x,y);
      svg.append(node('rect', {x:offsetX+x*cell,y:offsetY+y*cell,width:cell,height:cell,fill:blocked?'var(--foreground)':'transparent',stroke:'var(--border)','stroke-width':blocked?'0':'0.7',opacity:blocked?'0.9':'1'}));
    }
    [[4,2,'RACK'],[15,2,'RACK'],[4,6,'RACK'],[15,6,'RACK'],[4,10,'RACK'],[15,10,'RACK']].forEach(([x,y,label]) => {
      const [tx,ty] = center([x+2.5,y]);
      svg.append(node('text', {x:tx,y:ty+5,'text-anchor':'middle',fill:'var(--background)','font-weight':'500'},label));
    });
    if (frame >= 5) route(oldRoute, 'var(--muted-foreground)', '9 8', '0.55');
    route(frame >= 5 ? newRoute : oldRoute, frame >= 5 ? 'var(--green)' : 'var(--viz-series-1)', '', '0.9');
    station([2,8], 'A', 'var(--orange)');
    station([21,8], 'B', 'var(--green)');
    drawHuman(humans[frame]);
    drawRobot(robots[frame], frame);
    const score = scores[frame] === null ? 'not active' : scores[frame].toFixed(2) + ' / 0.60';
    status.textContent = `Step ${frame + 1} of ${robots.length} | ${actions[frame]} | robot (${robots[frame][0]}, ${robots[frame][1]}) | human (${humans[frame][0]}, ${humans[frame][1]}) | reroute score ${score}`;
  }
  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    play.textContent = 'Play';
  }
  function start() {
    if (frame === robots.length - 1) frame = 0;
    play.textContent = 'Pause';
    timer = setInterval(() => {
      if (frame >= robots.length - 1) { stop(); return; }
      frame += 1;
      draw();
    }, 550);
  }
  play.addEventListener('click', () => timer ? stop() : start());
  root.querySelector('#warehouse-prev').addEventListener('click', () => { stop(); frame=Math.max(0,frame-1); draw(); });
  root.querySelector('#warehouse-next').addEventListener('click', () => { stop(); frame=Math.min(robots.length-1,frame+1); draw(); });
  root.querySelector('#warehouse-reset').addEventListener('click', () => { stop(); frame=0; draw(); });
  draw();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(start, 500);
})();
</script>
