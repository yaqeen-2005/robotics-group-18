<div id="nav-demo" style="display:grid;gap:calc(var(--font-size-base)*0.75)">
  <div>
    <h1>Dynamic warehouse navigation</h1>
    <p class="text-muted">Simulated SLAM pose + moving human + event-aware A*</p>
  </div>
  <div class="viz-controls" aria-label="Animation controls">
    <button class="btn btn-primary" id="nav-play" type="button">Play</button>
    <button class="btn" id="nav-prev" type="button">Previous</button>
    <button class="btn" id="nav-next" type="button">Next</button>
    <button class="btn btn-ghost" id="nav-reset" type="button">Reset</button>
  </div>
  <div class="viz-row text-small" id="nav-status" aria-live="polite"></div>
  <svg id="nav-grid" viewBox="0 0 720 480" role="img" aria-label="Warehouse grid showing the robot, moving human, goal and current A-star path" style="width:100%;height:auto"></svg>
  <div class="viz-row text-small text-muted" aria-label="Legend">
    <span>● Robot</span><span>● Human</span><span>◆ Goal</span><span>— Current path</span>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('nav-demo');
  const svg = root.querySelector('#nav-grid');
  const status = root.querySelector('#nav-status');
  const play = root.querySelector('#nav-play');
  const frames = [
    [0,'MOVE',[2,4],[11,3],null,[[2,5],[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [1,'WAIT',[2,4],[10,3],0.26,[[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [2,'WAIT',[2,4],[9,3],0.32,[[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [3,'WAIT',[2,4],[8,3],0.38,[[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [4,'WAIT',[2,4],[8,3],0.46,[[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [5,'WAIT',[2,4],[8,3],0.54,[[2,4],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[12,3],[13,3],[14,3],[15,3],[15,4],[15,5]],0],
    [6,'REROUTE',[2,5],[8,3],0.62,[[2,4],[2,5],[2,6],[2,7],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [7,'MOVE',[2,6],[8,3],null,[[2,5],[2,6],[2,7],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [8,'MOVE',[2,7],[8,3],null,[[2,6],[2,7],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [9,'MOVE',[2,8],[8,3],null,[[2,7],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [10,'MOVE',[3,8],[8,3],null,[[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [11,'MOVE',[4,8],[8,3],null,[[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [12,'MOVE',[5,8],[9,3],null,[[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [13,'MOVE',[6,8],[10,3],null,[[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [14,'MOVE',[7,8],[11,3],null,[[6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [15,'MOVE',[8,8],[12,3],null,[[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [16,'MOVE',[9,8],[12,3],null,[[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [17,'MOVE',[10,8],[12,3],null,[[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [18,'MOVE',[11,8],[12,3],null,[[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [19,'MOVE',[12,8],[12,3],null,[[11,8],[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [20,'MOVE',[13,8],[12,3],null,[[12,8],[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [21,'MOVE',[14,8],[12,3],null,[[13,8],[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [22,'MOVE',[15,8],[12,3],null,[[14,8],[15,8],[15,7],[15,6],[15,5]],1],
    [23,'MOVE',[15,7],[12,3],null,[[15,8],[15,7],[15,6],[15,5]],1],
    [24,'MOVE',[15,6],[12,3],null,[[15,7],[15,6],[15,5]],1],
    [25,'MOVE',[15,5],[12,3],null,[[15,6],[15,5]],1]
  ];
  const width = 18, height = 12, cell = 36, offsetX = 36, offsetY = 24;
  const ns = 'http://www.w3.org/2000/svg';
  let index = 0, timer = null;
  function node(name, attrs) {
    const el = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key,value]) => el.setAttribute(key, value));
    return el;
  }
  function center(point) { return [offsetX + point[0]*cell + cell/2, offsetY + point[1]*cell + cell/2]; }
  function draw() {
    svg.replaceChildren();
    for (let y=0; y<height; y++) for (let x=0; x<width; x++) {
      const wall = y===0 || y===height-1 || x===0 || x===width-1 || (x===8 && y!==3 && y!==8);
      svg.append(node('rect', {x:offsetX+x*cell,y:offsetY+y*cell,width:cell,height:cell,fill:wall?'var(--muted-foreground)':'var(--card)',opacity:wall?'0.65':'1',stroke:'var(--border)','stroke-width':'1'}));
    }
    const frame = frames[index];
    const points = frame[5].map(point => center(point).join(',')).join(' ');
    svg.append(node('polyline', {points,fill:'none',stroke:'var(--viz-series-1)','stroke-width':'6','stroke-linecap':'round','stroke-linejoin':'round',opacity:'0.8'}));
    const [gx,gy] = center([15,5]);
    svg.append(node('rect', {x:gx-9,y:gy-9,width:18,height:18,fill:'var(--green)',transform:`rotate(45 ${gx} ${gy})`}));
    const [hx,hy] = center(frame[3]);
    svg.append(node('circle', {cx:hx,cy:hy,r:12,fill:'var(--red)'}));
    const [rx,ry] = center(frame[2]);
    svg.append(node('circle', {cx:rx,cy:ry,r:13,fill:'var(--blue)',stroke:'var(--background)','stroke-width':'3'}));
    const score = frame[4] === null ? '—' : frame[4].toFixed(2);
    status.textContent = `Tick ${frame[0]} · ${frame[1]} · reroute score ${score} · reroutes ${frame[6]}`;
  }
  function stop() { if (timer) clearInterval(timer); timer=null; play.textContent='Play'; }
  function start() {
    if (index === frames.length-1) index=0;
    play.textContent='Pause';
    timer=setInterval(() => { if (index >= frames.length-1) { stop(); return; } index++; draw(); }, 500);
  }
  play.addEventListener('click', () => timer ? stop() : start());
  root.querySelector('#nav-prev').addEventListener('click', () => { stop(); index=Math.max(0,index-1); draw(); });
  root.querySelector('#nav-next').addEventListener('click', () => { stop(); index=Math.min(frames.length-1,index+1); draw(); });
  root.querySelector('#nav-reset').addEventListener('click', () => { stop(); index=0; draw(); });
  draw();
})();
</script>
