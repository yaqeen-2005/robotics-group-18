#VRML_SIM R2025a utf8
# Simple rigid load; full box is both visual and collision geometry.
PROTO Pallet [
  field SFVec3f translation 0 0 0.52
  field SFRotation rotation 0 0 1 0
  field SFString name "pallet"
  field SFVec3f size 0.8 1.2 0.08
  field SFFloat mass 10
  field SFColor color 0.65 0.42 0.18
] {
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [ Shape {
      appearance PBRAppearance { baseColor IS color roughness 0.9 metalness 0 }
      geometry Box { size IS size }
    } ]
    boundingObject Box { size IS size }
    physics Physics { density -1 mass IS mass }
  }
}
