#VRML_SIM R2025a utf8
# One rigid body: deck plus cargo. Mass includes both. Origin at deck centre.
PROTO TestLoad [
  field SFVec3f translation 0 0 0.52
  field SFString name "test_load"
  field SFVec3f deckSize 0.8 1.2 0.08
  field SFVec3f cargoSize 0.72 1.12 0.32
  field SFVec3f cargoOffset 0 0 0.20
  field SFFloat mass 10
  field SFColor color 0.35 0.65 0.35
  field SFFloat transparency 0
] {
  Solid {
    translation IS translation
    name IS name
    children [
      Shape {
        appearance PBRAppearance { baseColor 0.48 0.30 0.14 roughness 0.9 metalness 0 transparency IS transparency }
        geometry Box { size IS deckSize }
      }
      Pose { translation IS cargoOffset children [ Shape {
        appearance PBRAppearance { baseColor IS color roughness 0.8 metalness 0 transparency IS transparency }
        geometry Box { size IS cargoSize }
      } ] }
    ]
    boundingObject Group { children [
      Box { size IS deckSize }
      Pose { translation IS cargoOffset children [ Box { size IS cargoSize } ] }
    ] }
    physics Physics { density -1 mass IS mass }
  }
}
